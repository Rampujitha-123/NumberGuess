<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess the Number</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .game-container {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .number-input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }

        .number-input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 10px;
        }

        .guess-btn {
            background: #667eea;
            color: white;
        }

        .guess-btn:hover {
            background: #5568d8;
        }

        .reset-btn {
            background: #eee;
            color: #333;
        }

        .message {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            min-height: 30px;
        }

        .attempts {
            margin-top: 15px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="game-container">

        <h1>🎯 Guess the Number</h1>

        <p class="subtitle">
            I have selected a number between 1 and 100.
            Can you guess it?
        </p>

        <input
            type="number"
            id="guessInput"
            class="number-input"
            placeholder="Enter your guess"
            min="1"
            max="100"
        >

        <button
            class="guess-btn"
            onclick="makeGuess()">
            Guess
        </button>

        <div id="message" class="message"></div>

        <div class="attempts">
            Attempts: <span id="attempts">0</span>
        </div>

        <button
            class="reset-btn"
            onclick="resetGame()">
            🔄 Play Again
        </button>

    </div>


    <script>

        async function makeGuess() {

            const input = document.getElementById("guessInput");
            const message = document.getElementById("message");
            const attempts = document.getElementById("attempts");

            const guess = input.value;

            if (guess === "") {
                message.textContent = "Please enter a number.";
                return;
            }

            const response = await fetch("/guess", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    guess: guess
                })
            });

            const data = await response.json();

            message.textContent = data.message;

            if (data.attempts !== undefined) {
                attempts.textContent = data.attempts;
            }

            input.value = "";
            input.focus();

            if (data.won) {
                message.textContent = "🎉 " + data.message;
            }
        }


        async function resetGame() {

            const response = await fetch("/reset", {
                method: "POST"
            });

            const data = await response.json();

            document.getElementById("message").textContent =
                data.message;

            document.getElementById("attempts").textContent = "0";

            document.getElementById("guessInput").value = "";

            document.getElementById("guessInput").focus();
        }

    </script>

</body>

</html>
